name: Compiler l'APK

on:
  push:
    branches: [master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk MaCave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MaCave
          path: MaCave.apk

      - name: Publier l'APK téléchargeable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.${{ github.run_number }}" MaCave.apk \
            --target "${{ github.sha }}" \
            --title "Ma Cave 2.${{ github.run_number }}" \
            --notes "Sur le téléphone : téléchargez MaCave.apk ci-dessous, ouvrez-le et autorisez l'installation."
